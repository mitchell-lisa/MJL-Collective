    <rect x="146" y="39" width="56" height="4" rx="2" fill="#c8c8ce"/>
    <circle cx="70" cy="37" r="4.5" fill="#ff5f57"/>
    <circle cx="86" cy="37" r="4.5" fill="#febc2e"/>
    <circle cx="102" cy="37" r="4.5" fill="#28c840"/>
    <rect x="66" y="64" width="768" height="20" rx="10" fill="#ffffff" stroke="#d2d2d6"/>
    <circle cx="82" cy="74" r="3.2" fill="none" stroke="#b0b0b6" stroke-width="1.4"/>
    <rect x="94" y="72.5" width="84" height="3" rx="1.5" fill="#d0d0d4"/>
