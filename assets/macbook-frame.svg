<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" fill="none">
  <defs>
    <linearGradient id="lid" x1="80" y1="4" x2="820" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.18" stop-color="#242428"/>
      <stop offset="0.6" stop-color="#161618"/>
      <stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <linearGradient id="rim" x1="36" y1="4" x2="864" y2="532" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8e8e96"/>
      <stop offset="0.35" stop-color="#3a3a40"/>
      <stop offset="1" stop-color="#6e6e76"/>
    </linearGradient>
    <linearGradient id="deck" x1="36" y1="518" x2="36" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c5c8ce"/>
      <stop offset="0.18" stop-color="#eceef1"/>
      <stop offset="0.72" stop-color="#f7f8f9"/>
      <stop offset="1" stop-color="#d5d8dd"/>
    </linearGradient>
  </defs>
  <!-- silver deck, the same width as the lid so the silhouette lines up -->
  <rect x="36" y="518" width="828" height="54" rx="8" fill="url(#deck)"/>
  <rect x="36" y="526" width="828" height="3" fill="#8d939c"/>
  <rect x="408" y="562" width="84" height="5" rx="2.5" fill="#c5cad1"/>
  <!-- lid, screen punched out so the capture fills the glass -->
  <path fill="url(#lid)" fill-rule="evenodd" d="
    M54 4
    H846
    A18 18 0 0 1 864 22
    V514
    A18 18 0 0 1 846 532
    H54
    A18 18 0 0 1 36 514
    V22
    A18 18 0 0 1 54 4
    Z
    M60 18
    H840
    A10 10 0 0 1 850 28
    V508
    A10 10 0 0 1 840 518
    H60
    A10 10 0 0 1 50 508
    V28
    A10 10 0 0 1 60 18
    Z"/>
  <path fill="none" stroke="url(#rim)" stroke-width="1.5" d="
    M54 5
    H846
    A17 17 0 0 1 863 22
    V514
    A17 17 0 0 1 846 531
    H54
    A17 17 0 0 1 37 514
    V22
    A17 17 0 0 1 54 5
    Z"/>
  <!-- browser window inside the glass: a short tab strip, then a short address bar.
       The capture starts at the y=58 hairline. site.css screen-t is 10%. -->
  <clipPath id="glass">
    <path d="M60 18 H840 A10 10 0 0 1 850 28 V508 A10 10 0 0 1 840 518 H60 A10 10 0 0 1 50 508 V28 A10 10 0 0 1 60 18 Z"/>
  </clipPath>
  <g clip-path="url(#glass)">
    <path fill="#e6e6ea" d="M60 18 H840 A10 10 0 0 1 850 28 V38 H50 V28 A10 10 0 0 1 60 18 Z"/>
    <rect x="50" y="38" width="800" height="20" fill="#f4f4f6"/>
    <path fill="#ffffff" d="M108 39 V27 A4 4 0 0 1 112 23 H250 A4 4 0 0 1 254 27 V39 Z"/>
    <rect x="161" y="29.5" width="40" height="2.5" rx="1.25" fill="#c8c8ce"/>
    <circle cx="66" cy="29" r="2.8" fill="#ff5f57"/>
    <circle cx="77" cy="29" r="2.8" fill="#febc2e"/>
    <circle cx="88" cy="29" r="2.8" fill="#28c840"/>
    <rect x="60" y="42" width="780" height="12" rx="6" fill="#ffffff" stroke="#d2d2d6" stroke-width="0.8"/>
    <circle cx="74" cy="48" r="2.1" fill="none" stroke="#b0b0b6" stroke-width="1.1"/>
    <rect x="82" y="46.8" width="58" height="2.4" rx="1.2" fill="#d0d0d4"/>
    <rect x="50" y="58" width="800" height="1" fill="#d0d0d4"/>
  </g>
  <!-- camera notch, on the glass, over the tab strip -->
  <rect x="426" y="12" width="48" height="16" rx="5" fill="#0c0c0e"/>
</svg>
