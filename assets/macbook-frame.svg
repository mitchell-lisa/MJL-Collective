<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" fill="none">
  <defs>
    <linearGradient id="lid" x1="80" y1="4" x2="820" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.18" stop-color="#242428"/>
      <stop offset="0.6" stop-color="#161618"/>
      <stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <linearGradient id="rim" x1="36" y1="4" x2="864" y2="532" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8e8e96"/>
      <stop offset="0.35" stop-color="#3a3a40"/>
      <stop offset="1" stop-color="#6e6e76"/>
    </linearGradient>
    <linearGradient id="deck" x1="12" y1="518" x2="12" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c5c8ce"/>
      <stop offset="0.18" stop-color="#eceef1"/>
      <stop offset="0.72" stop-color="#f7f8f9"/>
      <stop offset="1" stop-color="#d5d8dd"/>
    </linearGradient>
  </defs>
  <!-- silver deck, slightly wider than the lid -->
  <rect x="12" y="518" width="876" height="54" rx="8" fill="url(#deck)"/>
  <rect x="36" y="526" width="828" height="3" fill="#8d939c"/>
  <rect x="408" y="562" width="84" height="5" rx="2.5" fill="#c5cad1"/>
